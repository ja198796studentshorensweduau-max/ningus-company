<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ningus Company</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1020; color: #e8eaf6; font-family: "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  #msg.hide { display: none; }
  #text { font-size: 14px; max-width: 480px; word-break: break-word; }
  #text.err { color: #ff9a9a; }
  button { font: inherit; font-size: 13px; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; background: #5b6cff; display: none; }
</style>
</head>
<body>
<div id="msg"><div id="text">Loading Ningus Company...</div><button id="retry" onclick="load()">Retry</button></div>
<iframe id="app" allow="fullscreen; autoplay; clipboard-write"></iframe>

<script>
// ------------- Config -------------
// Google Drive file link (file must be shared as "Anyone with the link can view")
var SOURCE = 'https://drive.google.com/file/d/1iwImRjYDUQ4XeqmQAz7VtpS2qnL4mzba/view?usp=drive_link';

// Google Drive API key (free, from Google Cloud Console with the Drive API enabled).
// Browsers block direct Drive downloads, so this is needed for reliable loading.
var API_KEY = 'AIzaSyC7IUwJ30zpQs32-kSDw-p5SL_DVM7jRBI';
// ----------------------------------

var CACHE_KEY = 'ningus-company-index';
var frame = document.getElementById('app');
var msg = document.getElementById('msg'), text = document.getElementById('text'), retry = document.getElementById('retry');

function getFileId(u) {
  var m = u.match(/\/d\/([a-zA-Z0-9_-]+)/) || u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

function driveUrls(id) {
  var urls = [];
  if (API_KEY) urls.push('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media&key=' + encodeURIComponent(API_KEY));
  urls.push('https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t');
  return urls;
}

function status(t, isErr, showRetry) {
  msg.className = '';
  text.className = isErr ? 'err' : '';
  text.textContent = t;
  retry.style.display = showRetry ? 'inline-block' : 'none';
  frame.style.display = 'none';
}

// Runs inside the app: the launcher always loads the newest file from Drive,
// so any "version.json" check the app makes is answered locally instead of hitting the network.
function appShim(src) {
  var f = window.fetch;
  var id = (src.match(/\/d\/([\w-]+)/) || [])[1];
  window.fetch = function (u, o) {
    try {
      var s = typeof u === 'string' ? u : (u && u.url) || '';
      var n = s.split('?')[0].split('#')[0].split('/').pop();
      // If the app tries to download the Drive link itself (blocked by the browser), hand it the copy the launcher already fetched
      if (id && s.indexOf(id) > -1 && window.parent && window.parent.__ningusHtml) {
        return Promise.resolve(new Response(window.parent.__ningusHtml, { status: 200, headers: { 'Content-Type': 'text/html' } }));
      }
      if (n === 'version.json') {
        var v = String(Date.now());
        return Promise.resolve(new Response(JSON.stringify({ version: v, v: v, download: src }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
    } catch (e) {}
    return f.apply(this, arguments);
  };
}

function show(html) {
  window.__ningusHtml = html; // untouched copy, served if the app tries to download the Drive link
  var shim = '<script>(' + appShim.toString() + ')(' + JSON.stringify(SOURCE) + ');<\/script>';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + shim; }) : shim + html;
  frame.srcdoc = html;
  frame.style.display = 'block';
  msg.className = 'hide';
}

function fetchFirst(urls, i, lastErr) {
  if (i >= urls.length) return Promise.reject(lastErr || new Error('No source available'));
  return fetch(urls[i], { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) {
        var hint = '';
        if (r.status === 403) hint = ' (is the file shared as "Anyone with the link"? Is the API key valid with Drive API enabled?)';
        if (r.status === 404) hint = ' (file not found: check the file ID and sharing settings)';
        throw new Error('HTTP ' + r.status + hint);
      }
      return r.text();
    })
    .then(function (html) {
      if (/<title>\s*Google Drive/i.test(html) && /accounts\.google\.com|virus scan|can't scan/i.test(html)) {
        throw new Error('Drive returned a sign-in/warning page instead of the file.');
      }
      return html;
    })
    .catch(function (e) {
      if (e instanceof TypeError) {
        e = new Error('Request blocked (likely CORS)' + (API_KEY ? '' : ' - add a Google Drive API key in the launcher config'));
      }
      return fetchFirst(urls, i + 1, e);
    });
}

// Every launch fetches the latest file from Drive (no caching); the cached copy is only an offline fallback.
function load() {
  var id = getFileId(SOURCE);
  if (!id) { status('Could not read a file ID from the Drive link.', true, false); return; }
  status('Loading Ningus Company...');
  fetchFirst(driveUrls(id), 0)
    .then(function (html) {
      if (!html.trim()) throw new Error('The file on Google Drive is empty.');
      show(html);
    })
    .catch(function (e) {
      console.warn('Drive load failed:', e.message);
      status('Could not load from Google Drive: ' + e.message, true, true);
    });
}

load();
</script>
</body>
</html>
