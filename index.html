<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ningus Company</title>
<style>
  :root { --bg1:#1a2040; --bg2:#0d1020; --text:#e8eaf6; --muted:#8b93c4; --track:#262c52; --err:#ff9a9a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)); background-color: var(--bg2);
  }
  .card { width: 100%; max-width: 440px; padding: 28px 32px; border-radius: 16px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
    font-size: 24px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #7a5cff, #3fa9ff); }
  .name { font-size: 22px; font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); }
  #status { margin-top: 30px; font-size: 14px; min-height: 20px; }
  .track { margin-top: 12px; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; position: relative; }
  #fill { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #7a5cff, #3fa9ff); transition: width .15s; }
  .indet #fill { position: absolute; width: 35%; animation: slide 1.1s ease-in-out infinite; transition: none; }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }
  .error #fill { background: #ff6b6b; }
  #detail { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
  #err { display: none; margin-top: 14px; font-size: 12px; color: var(--err); word-break: break-word; }
  #btns { display: none; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; background: #5b6cff; }
  button.alt { background: #2c3359; }
  button:hover { filter: brightness(1.15); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">
    <div class="logo">N</div>
    <div><div class="name">Ningus Company</div><div class="sub" id="ver">Launcher</div></div>
  </div>
  <div id="status">Starting...</div>
  <div class="track" id="track"><div id="fill"></div></div>
  <div id="detail"></div>
  <div id="err"></div>
  <div id="btns">
    <button id="retry">Retry</button>
    <button id="existing" class="alt">Launch installed version</button>
  </div>
</div>

<script>
// ------------- Config -------------
var VERSION_URL = 'https://github.com/ja198796studentshorensweduau-max/ningus-company/blob/main/version.json';
// ----------------------------------

var $ = function (id) { return document.getElementById(id); };
var local = null;

// ---- storage (IndexedDB, lives in the browser profile; survives restarts) ----
function openDb() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open('ningus-company', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function kvGet(k) {
  return openDb().then(function (d) {
    return new Promise(function (res, rej) {
      var q = d.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
  });
}
function kvSet(k, v) {
  return openDb().then(function (d) {
    return new Promise(function (res, rej) {
      var t = d.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
    });
  });
}

// ---- helpers ----
function ui(msg, pct, detail) {
  $('status').textContent = msg;
  $('detail').textContent = detail || '';
  var t = $('track');
  if (pct < 0) t.className = 'track indet';
  else { t.className = 'track'; $('fill').style.width = pct + '%'; }
}
function fail(msg) {
  $('card').className = 'card error';
  $('status').textContent = 'Something went wrong';
  $('track').className = 'track'; $('fill').style.width = '100%';
  $('err').style.display = 'block'; $('err').textContent = msg;
  $('btns').style.display = 'flex';
  $('existing').style.display = local ? 'inline-block' : 'none';
}
// github.com/u/r/blob/branch/path -> raw.githubusercontent.com/u/r/branch/path (browser-friendly, CORS enabled)
function toRaw(u) {
  return String(u).replace(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/, 'https://raw.githubusercontent.com/$1/$2/$3');
}
function cmpVer(a, b) {
  var pa = String(a).replace(/^[vV]/, '').split('.'), pb = String(b).replace(/^[vV]/, '').split('.');
  for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
    var x = parseInt(pa[i] || '0', 10), y = parseInt(pb[i] || '0', 10);
    if (isNaN(x) || isNaN(y)) return String(a) === String(b) ? 0 : 1;
    if (x !== y) return x > y ? 1 : -1;
  }
  return 0;
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// ---- steps ----
async function getRemote() {
  var r = await fetch(toRaw(VERSION_URL) + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('version.json: HTTP ' + r.status);
  var txt = (await r.text()).replace(/^\uFEFF/, '').replace(/,(\s*[}\]])/g, '$1');
  var j;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('version.json is empty or not valid JSON.'); }
  if (!j.version || !j.download) throw new Error('version.json must contain "version" and "download".');
  return j;
}

async function install(remote) {
  ui('Downloading update...', -1);
  var resp;
  try { resp = await fetch(toRaw(remote.download) + (remote.download.indexOf('?') < 0 ? '?t=' + Date.now() : ''), { cache: 'no-store' }); }
  catch (e) {
    throw new Error('The browser was blocked from downloading that link (GitHub release downloads usually block web pages). ' +
      'Put the file in the repo and use its github.com/.../blob/... or raw.githubusercontent.com link as "download".');
  }
  if (!resp.ok) throw new Error('Download failed: HTTP ' + resp.status);
  var total = parseInt(resp.headers.get('content-length') || '0', 10), got = 0, chunks = [];
  var reader = resp.body.getReader();
  for (;;) {
    var s = await reader.read();
    if (s.done) break;
    chunks.push(s.value); got += s.value.length;
    var mb = (got / 1048576).toFixed(2) + ' MB';
    if (total > 0 && got <= total) ui('Downloading update...', Math.round(got / total * 95), mb + ' of ' + (total / 1048576).toFixed(2) + ' MB');
    else ui('Downloading update...', -1, mb);
  }
  var blob = new Blob(chunks);
  var head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  if (head[0] === 0x50 && head[1] === 0x4B) throw new Error('The download is a .zip. A browser launcher can only run a single .html file.');
  ui('Installing...', 98);
  var html = await blob.text();
  await kvSet('app', { version: String(remote.version), html: html, savedAt: Date.now() });
  local = await kvGet('app');
  ui('Installed', 100, 'Version ' + remote.version);
  await sleep(500);
}

async function launch() {
  try {
    local = await kvGet('app');
    if (!local) throw new Error('Nothing is installed yet.');
    ui('Launching...', 100, 'Version ' + local.version);
    var url = URL.createObjectURL(new Blob([local.html], { type: 'text/html' }));
    window.__appUrl = url;
    setTimeout(function () {
      // still here? browser may have blocked it, offer a manual button
      $('btns').style.display = 'flex'; $('retry').style.display = 'none';
      $('existing').style.display = 'inline-block'; $('existing').textContent = 'Open in new tab';
      $('existing').onclick = function () { window.open(url, '_blank'); };
    }, 2500);
    await sleep(400);
    location.replace(url);
  } catch (e) { fail(e.message); }
}

async function start() {
  $('card').className = 'card';
  $('err').style.display = 'none'; $('btns').style.display = 'none';
  $('retry').style.display = 'inline-block'; $('existing').textContent = 'Launch installed version';
  $('existing').onclick = launch;
  ui('Checking for updates...', -1);
  try { local = await kvGet('app'); } catch (e) { local = null; }
  if (local) $('ver').textContent = 'Installed version ' + local.version;

  var remote;
  try { remote = await getRemote(); }
  catch (e) {
    var why = (e instanceof TypeError) ? 'no connection' : e.message;
    if (local) { ui('Could not check for updates (' + why + ')', 100, 'Launching installed version...'); await sleep(1200); return launch(); }
    return fail('Could not get version info: ' + why);
  }

  if (!local || cmpVer(remote.version, local.version) > 0) {
    $('ver').textContent = 'Installing version ' + remote.version;
    try { await install(remote); }
    catch (e) {
      if (local) { ui('Update failed', 100, 'Launching installed version...'); $('err').style.display = 'block'; $('err').textContent = e.message; await sleep(3000); return launch(); }
      return fail(e.message);
    }
  } else {
    ui('Up to date', 100, 'Version ' + local.version);
    await sleep(500);
  }
  launch();
}

$('retry').onclick = start;
$('existing').onclick = launch;
start();
</script>
</body>
</html>
